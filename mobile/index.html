<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34050D">
<title>Relix Mobile – CMMS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<style>
:root{
  --nav:#34050D;--accent:#C00018;--accent-d:#A30014;--bg:#F6F7F9;--surface:#fff;--border:#E4E7EC;
  --text:#1E2430;--text2:#667085;--text3:#98A2B3;--ok:#0B6B4A;--ok-bg:#E6F4EE;--info:#2456B8;--info-bg:#EAF1FD;
  --warn:#B54708;--warn-bg:#FEF3E2;--crit:#B42318;--crit-bg:#FDECEC;--req:#6941C6;--req-bg:#F3EEFC;--muted-bg:#EEF1F4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text);background:#E9EBEF;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- page layout: presenter panel + phone ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px}
.side{max-width:360px;color:var(--text)}
.side .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--nav)}
.side .logo i{width:34px;height:34px;border-radius:8px;background:var(--nav);color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px}
.side h1{font-size:26px;line-height:1.2;margin:18px 0 8px}
.side p{color:var(--text2);line-height:1.5;margin-bottom:18px}
.side h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px}
.jump{display:flex;flex-direction:column;gap:8px}
.jump button{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:left}
.jump button:hover{border-color:var(--accent)}
.jump button .ms{color:var(--accent);font-size:20px}
.jump small{display:block;color:var(--text2);font-size:12px}
.side .note{font-size:12px;color:var(--text3);margin-top:18px}
.phone{width:390px;height:844px;border-radius:46px;background:#111;padding:12px;box-shadow:0 30px 60px rgba(16,24,40,.25);flex:none;position:relative}
.screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#111;border-radius:20px;z-index:50}
@media (max-width:820px){
  body{background:var(--bg)}
  .stage{padding:0;display:block;height:100%}
  .side{display:none}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0}
  .notch{display:none}
  .statusbar{display:none!important}
}

/* ---------- app chrome ---------- */
.statusbar{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:600;color:#fff;background:var(--nav)}
.statusbar .ms{font-size:16px}
.appbar{background:var(--nav);color:#fff;padding:10px 16px 12px;flex:none}
.appbar .row{display:flex;align-items:center;gap:10px}
.appbar .ttl{font-size:20px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
.appbar .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.1)}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:#3CCB7F}
.conn.off{background:#FEF3E2;color:var(--warn)}
.conn.off .dot{background:var(--warn)}
.offbanner{flex:none;background:#FEF3E2;color:var(--warn);font-size:12px;font-weight:500;padding:8px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #F9DBAF}
.offbanner .ms{font-size:18px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.pad{padding:14px 16px 24px}
.tabbar{flex:none;height:76px;background:#fff;border-top:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-around;padding:8px 6px 0;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--text3);position:relative}
.tab .ms{font-size:24px}
.tab.on{color:var(--accent)}
.tab.on .ms{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.tab .bdg{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.scanbtn{flex:none;width:62px;height:62px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 18px rgba(192,0,24,.35);border:4px solid #fff}
.scanbtn .ms{font-size:30px}

/* ---------- common ---------- */
.seg{display:flex;background:var(--muted-bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:8px;font-weight:600;font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.seg .n{font-size:11px;background:var(--border);border-radius:9px;padding:1px 6px;color:var(--text2)}
.seg button.on .n{background:var(--nav);color:#fff}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.sec .ms{font-size:16px;margin-right:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.pill .ms{font-size:14px}
.p-crit{background:var(--accent);color:#fff}.p-high{background:var(--crit-bg);color:var(--crit)}.p-med{background:var(--warn-bg);color:var(--warn)}.p-low{background:var(--muted-bg);color:#475467}
.s-req{background:var(--req-bg);color:var(--req)}.s-sch{background:var(--info-bg);color:var(--info)}.s-prog{background:var(--ok-bg);color:var(--ok)}.s-done{background:var(--muted-bg);color:#475467}.s-wait{background:var(--warn-bg);color:var(--warn)}.s-late{background:var(--crit-bg);color:var(--crit)}
.btn{height:44px;border-radius:10px;padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn .ms{font-size:20px}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:active{background:var(--accent-d)}
.btn.sec2{background:#fff;border:1px solid var(--border)}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%}
.btn.lg{height:54px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.empty{text-align:center;color:var(--text3);padding:40px 20px}
.empty .ms{font-size:40px;display:block;margin-bottom:8px}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--nav);border-color:var(--nav);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* ---------- To do ---------- */
.hello{font-size:13px;color:var(--text2);margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kp div{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px}
.kp b{display:block;font-size:20px}
.kp span{font-size:11px;color:var(--text2)}
.kp .late b{color:var(--crit)}
.resume{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;border-left:4px solid var(--warn)}
.resume .t{font-weight:600;font-size:15px;margin:6px 0 2px}
.resume .m{font-size:12px;color:var(--text2)}
.prog{display:flex;gap:3px;margin:10px 0}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--border)}
.prog i.d{background:var(--ok)}.prog i.c{background:var(--warn)}
.wo{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:8px;position:relative;overflow:hidden}
.wo.late{background:#FEF6F6}
.wo.late:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.wo .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.wo .b{flex:1;min-width:0}
.wo .t{font-weight:600;font-size:14px;line-height:1.3}
.wo .m{font-size:12px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wo .m .ms{font-size:14px}
.wo .act{flex:none}
.wo .go{height:36px;padding:0 12px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px}
.wo .go.res{background:var(--warn)}
.wo .go .ms{font-size:18px}
.wo .who{font-size:11px;color:var(--text3)}

/* ---------- detail ---------- */
.hero{background:#fff;border-bottom:1px solid var(--border);padding:16px}
.hero h2{font-size:19px;line-height:1.3;margin:8px 0 4px}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center}
.kv div:last-child{border:0}
.kv .ms{color:var(--text3);font-size:20px}
.kv span{color:var(--text2);font-size:13px;width:90px;flex:none}
.kv b{font-weight:500;font-size:14px;flex:1}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 20%);padding:16px;display:flex;gap:10px}
.rowlink{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border)}
.rowlink:last-child{border:0}
.rowlink .ms.l{color:var(--text2)}
.rowlink .x{flex:1}
.rowlink small{display:block;color:var(--text2);font-size:12px}
.rowlink .ms.r{color:var(--text3)}

/* ---------- intervention ---------- */
.runbar{background:var(--nav);color:#fff;padding:8px 12px 10px;flex:none}
.runbar .row{display:flex;align-items:center;gap:8px}
.runbar .ttl{flex:1;min-width:0}
.runbar .ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runbar .ttl small{font-size:11px;color:rgba(255,255,255,.65)}
.timer{font-family:'IBM Plex Mono',monospace;font-size:12px;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:5px}
.timer i{width:7px;height:7px;border-radius:50%;background:#3CCB7F}
.timer.p i{background:#F79009}
.runprog{display:flex;gap:3px;margin-top:10px}
.runprog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.runprog i.d{background:#fff}.runprog i.c{background:#FF8A96}
.step{padding:18px 16px 120px}
.step .no{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.step .no .req{color:var(--text2);font-weight:500;text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:3px}
.step .no .req .ms{font-size:14px}
.step h2{font-size:22px;line-height:1.25;margin:6px 0 6px}
.step .help{color:var(--text2);line-height:1.45;margin-bottom:16px}
.safety{background:#FFFAEB;border:1px solid #FEDF89;border-radius:12px;padding:12px;margin-bottom:14px}
.safety h4{color:var(--warn);font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tick{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;text-align:left;width:100%}
.tick .bx{width:26px;height:26px;border-radius:8px;border:2px solid #D0D5DD;display:grid;place-items:center;flex:none;color:#fff}
.tick.on{border-color:var(--ok);background:#F6FEF9}
.tick.on .bx{background:var(--ok);border-color:var(--ok)}
.tick .bx .ms{font-size:18px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{height:64px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.yn button.on.y{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.yn button.on.n{border-color:var(--crit);background:var(--crit-bg);color:var(--crit)}
.num{display:flex;align-items:center;gap:10px}
.num input{flex:1;height:64px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:28px;font-weight:600;text-align:center;outline:none;min-width:0}
.num input:focus{border-color:var(--info)}
.num .u{font-size:18px;color:var(--text2);width:56px}
.range{font-size:13px;color:var(--text2);margin-top:8px;display:flex;align-items:center;gap:6px}
.range.bad{color:var(--crit);font-weight:600}
.photo{height:150px;border:2px dashed #D0D5DD;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text2);width:100%}
.photo .ms{font-size:34px;color:var(--accent)}
.shot{height:150px;border-radius:12px;background:linear-gradient(135deg,#566173,#2B3240);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:10px;font-size:12px;position:relative}
.shot .ms{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;opacity:.35}
.qty{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px}
.qty .x{flex:1}
.qty .x small{display:block;color:var(--text2);font-size:12px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center}
.qty b{font-size:20px;width:28px;text-align:center}
textarea.ta{width:100%;min-height:96px;border:1px solid var(--border);border-radius:12px;padding:12px;outline:none;resize:none;background:#fff}
textarea.ta:focus{border-color:var(--info)}
.docchip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:14px}
.docchip .ms{color:var(--crit)}
.docchip .x{flex:1;font-size:13px;font-weight:500}
.docchip small{display:block;color:var(--text3);font-size:11px;font-weight:400}
.runfoot{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 12px 18px;display:flex;gap:10px;align-items:center;z-index:5}
.runfoot .btn{flex:1}
.runfoot .btn.prev{flex:none;width:52px;padding:0;background:#fff;border:1px solid var(--border)}
.miss{position:absolute;left:0;right:0;bottom:76px;text-align:center;font-size:12px;color:var(--crit);font-weight:500;padding:6px;background:linear-gradient(transparent,var(--bg) 40%);z-index:4}
.fab{position:absolute;right:14px;bottom:92px;width:54px;height:54px;border-radius:50%;background:var(--nav);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(52,5,13,.35);z-index:6}
.fab .bdg{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
.lastmsg{position:absolute;right:76px;bottom:98px;max-width:220px;background:#fff;border:1px solid var(--border);border-radius:12px 12px 4px 12px;padding:8px 10px;font-size:12px;box-shadow:0 6px 16px rgba(16,24,40,.12);z-index:6}
.lastmsg b{display:block;font-size:11px;color:var(--text2)}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.45);z-index:20;animation:fade .15s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:21;display:flex;flex-direction:column;max-height:88%;animation:up .2s ease-out}
.sheet.tall{height:82%}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D0D5DD;margin:8px auto 4px}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;border-bottom:1px solid var(--border)}
.sheet .hd b{flex:1;font-size:16px}
.sheet .hd small{display:block;font-weight:400;color:var(--text2);font-size:12px}
.sheet .bd{flex:1;overflow-y:auto;padding:14px 16px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.opt .ms{color:var(--warn)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- chat ---------- */
.conv{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);width:100%;text-align:left}
.conv .x{flex:1;min-width:0}
.conv .x b{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.conv .x b small{font-weight:400;color:var(--text3);font-size:11px;flex:none}
.conv .x p{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv .u{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.cic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.msgs{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:86%}
.msg .bub{background:#fff;border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14px;line-height:1.4}
.msg .bub small{display:block;font-size:11px;color:var(--text2);font-weight:600;margin-bottom:2px}
.msg .tm{font-size:10px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:3px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--nav);color:#fff;border-color:var(--nav);border-radius:14px 4px 14px 14px}
.msg.me .tm{justify-content:flex-end}
.msg .ref{display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:12px;color:var(--text)}
.msg.me .ref{background:rgba(255,255,255,.12);color:#fff}
.mention{color:var(--accent);font-weight:600}
.msg.me .mention{color:#FFB3BC}
.sysmsg{align-self:center;font-size:11px;color:var(--text2);background:var(--muted-bg);border-radius:10px;padding:4px 10px}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px 14px;background:#fff;border-top:1px solid var(--border);flex:none}
.composer input{flex:1;height:42px;border-radius:21px;border:1px solid var(--border);padding:0 16px;outline:none;background:var(--bg)}
.composer button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.composer .send{background:var(--accent);color:#fff}

/* ---------- search ---------- */
.sbox{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;height:46px;padding:0 12px}
.sbox input{flex:1;border:0;outline:none;height:100%;font-size:15px;background:transparent;min-width:0}
.sbox .ms{color:var(--text3)}
.res{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.res .x{flex:1;min-width:0}
.res .x b{font-size:14px;display:block}
.res .x small{font-size:12px;color:var(--text2)}
.res .k{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
mark{background:#FFE7A8;color:inherit;border-radius:2px}
.recent{display:flex;align-items:center;gap:10px;padding:10px 2px;color:var(--text2);width:100%;text-align:left}

/* ---------- scan ---------- */
.cam{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#3A4250,#0E1116 75%);display:flex;flex-direction:column;align-items:center;color:#fff;z-index:2}
.cam .top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.cam .top .ib{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.vf{width:250px;height:250px;margin-top:40px;position:relative}
.vf i{position:absolute;width:44px;height:44px;border:4px solid #fff}
.vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.vf .line{position:absolute;left:14px;right:14px;height:2px;background:#FF4D61;box-shadow:0 0 12px #FF4D61;animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{top:14px}50%{top:232px}}
.vf .qr{position:absolute;inset:60px;opacity:.18;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 16px),repeating-linear-gradient(0deg,#fff 0 8px,transparent 8px 16px);background-blend-mode:difference}
.cam .hint{margin-top:22px;font-size:15px;font-weight:500}
.cam .hint small{display:block;text-align:center;color:rgba(255,255,255,.6);font-size:12px;font-weight:400;margin-top:4px}
.demo{margin-top:auto;width:100%;padding:16px;background:rgba(0,0,0,.35)}
.demo p{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:8px}
.demo .chips .chip{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.demo .man{margin-top:10px;display:flex;gap:8px}
.demo .man input{flex:1;height:40px;border-radius:10px;border:0;padding:0 12px;background:rgba(255,255,255,.14);color:#fff;outline:none;min-width:0}
.demo .man input::placeholder{color:rgba(255,255,255,.5)}
.eqhead{background:#fff;padding:16px;border-bottom:1px solid var(--border)}
.eqhead .row{display:flex;gap:14px;align-items:center}
.eqimg{width:64px;height:64px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--text2);flex:none}
.eqimg .ms{font-size:34px}
.eqhead h2{font-size:19px;line-height:1.2}
.eqhead .loc{font-size:12px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:4px}
.eqhead .loc .ms{font-size:14px}
.state{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bigact{display:flex;flex-direction:column;gap:10px}
.bigact button{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;text-align:left;width:100%}
.bigact .ms{font-size:28px}
.bigact b{display:block;font-size:16px}
.bigact small{font-size:12px;opacity:.8}
.bigact .a1{background:var(--accent);color:#fff}
.bigact .a2{background:#fff;border:2px solid #F9DBAF;color:var(--warn)}
.bigact .a2 b{color:var(--text)}
.bigact .a2 small{color:var(--text2);opacity:1}
.bigact .a3{background:#fff;border:1px solid var(--border)}
.bigact .a3 .ms{color:var(--text2)}
.bigact .a3 small{color:var(--text2)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-bottom:12px}
.alert b{color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.issue{height:76px;border-radius:12px;border:2px solid var(--border);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500}
.issue .ms{font-size:24px;color:var(--text2)}
.issue.on{border-color:var(--accent);background:#FEF6F6;color:var(--accent)}
.issue.on .ms{color:var(--accent)}
.tgl{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
.tgl .x{flex:1}
.tgl small{display:block;color:var(--text2);font-size:12px}
.sw{width:48px;height:28px;border-radius:14px;background:#D0D5DD;position:relative;flex:none;transition:.15s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on:after{left:23px}
.lbl{font-size:13px;font-weight:600;margin:18px 0 8px;display:block}

/* ---------- success / toast ---------- */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px 24px}
.done .big{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:18px}
.done .big .ms{font-size:48px}
.done h2{font-size:22px;margin-bottom:8px}
.done p{color:var(--text2);line-height:1.5;margin-bottom:24px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#1E2430;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13px;z-index:40;animation:up .2s ease-out;box-shadow:0 10px 24px rgba(16,24,40,.3)}
.toast .ms{color:#3CCB7F}
.toast.w .ms{color:#FDB022}
.queue{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.queue:last-child{border:0}
.queue .ms{color:var(--warn);font-size:20px}
.spin{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tag-off{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--warn);font-weight:600}
.tag-off .ms{font-size:14px}
</style>
</head>

function progOf(w){const a=ans(w.id);const n=steps(w).length;let d=0;steps(w).forEach((s,i)=>{if(isDone(w,i))d++});return{d,n}}
function isDone(w,i){const s=steps(w)[i],a=ans(w.id)[i];if(w.done&&w.done.includes(i)&&a==null)return true;if(a==null)return!s.req&&false;
  if(s.type==='confirm')return a.length===s.items.length;if(s.type==='number')return a!=null&&String(a).trim()!==''&&!isNaN(parseFloat(String(a).replace(',','.')));if(s.type==='text')return!s.req||String(a).trim().length>0;return a!=null}
function stepOk(w,i){const s=steps(w)[i];if(!s.req)return true;return isDone(w,i)}
function unreadTotal(){return Object.values(S.unread).reduce((a,b)=>a+b,0)}
function hl(t,q){if(!q)return esc(t);const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}

/* ================= SHELL ================= */
function render(scrollTop){
  const c=cur(),full=['run','review','done','scan','thread','incident'].includes(c.v);
  const keepScroll=!scrollTop&&$app.querySelector('.content')?$app.querySelector('.content').scrollTop:0;
  let h=`<div class="statusbar"><span>9:41</span><span>${ms('signal_cellular_alt')} ${S.online?ms('wifi'):ms('wifi_off')} ${ms('battery_5_bar')}</span></div>`;
  h+=VIEWS[c.v](c);
  if(!full)h+=tabbar();
  if(V.sheet)h+=SHEETS[V.sheet.type](V.sheet);
  if(V.toast)h+=`<div class="toast ${V.toast.w?'w':''}">${ms(V.toast.w?'cloud_off':'check_circle','f')}<span>${V.toast.t}</span></div>`;
  $app.innerHTML=h;
  const ct=$app.querySelector('.content');if(ct&&!scrollTop)ct.scrollTop=keepScroll;
  const af=$app.querySelector('[data-autofocus]');if(af&&scrollTop)setTimeout(()=>af.focus(),50);
  const ml=$app.querySelector('.msgs');if(ml){const p=ml.closest('.content,.bd');if(p)p.scrollTop=p.scrollHeight}
}
function tabbar(){const t=V.tab,u=unreadTotal(),my=S.wos.filter(w=>w.who===ME&&w.status!=='done'&&w.due!=='Upcoming').length;
  const T=(k,i,l,b)=>`<button class="tab ${t===k?'on':''}" data-act="tab" data-t="${k}">${ms(i)}${l}${b?`<span class="bdg">${b}</span>`:''}</button>`;
  return`<nav class="tabbar">${T('todo','checklist','To do',my)}${T('search','search','Search')}<button class="scanbtn" data-act="tab" data-t="scan" aria-label="Scan QR">${ms('qr_code_scanner')}</button>${T('chat','forum','Chat',u)}${T('me','person','Me',S.queue.length||'')}</nav>`}
function appbar(title,sub,opts={}){
  const c=`<button class="conn ${S.online?'':'off'}" data-act="sheet" data-s="sync"><span class="dot"></span>${S.online?'Online':'Offline'}${S.queue.length?` · ${S.queue.length}`:''}</button>`;
  return`<header class="appbar"><div class="row">${opts.back?`<button class="ib" data-act="back">${ms('arrow_back')}</button>`:''}<div class="ttl">${title}${sub?`<div class="sub">${sub}</div>`:''}</div>${opts.right||''}${c}</div></header>${S.online?'':`<div class="offbanner">${ms('cloud_off')}Offline · you can keep working, changes sync automatically</div>`}`}

/* ================= VIEWS ================= */
const VIEWS={};
VIEWS.todo=()=>{
  const mine=S.scope==='mine';const list=S.wos.filter(w=>mine?w.who===ME:w.who!==ME);
  const paused=list.filter(w=>w.status==='paused'||w.status==='prog');
  const today=list.filter(w=>w.status==='sched'&&(w.due==='Today'||w.due==='Overdue')).sort((a,b)=>(b.late?1:0)-(a.late?1:0));
  const up=list.filter(w=>w.status==='sched'&&w.due==='Upcoming');
  const done=list.filter(w=>w.status==='done');
  const nMine=S.wos.filter(w=>w.who===ME&&w.status!=='done').length,nTeam=S.wos.filter(w=>w.who!==ME&&w.status!=='done').length;
  let h=appbar('To do','Thourotte Plant · Mechanical team');
  h+=`<div class="content"><div class="pad">`;
  h+=`<div class="seg"><button class="${mine?'on':''}" data-act="scope" data-s="mine">My work <span class="n">${nMine}</span></button><button class="${mine?'':'on'}" data-act="scope" data-s="team">My team <span class="n">${nTeam}</span></button></div>`;
  if(mine){const late=list.filter(w=>w.late&&w.status==='sched').length;h+=`<div class="kp"><div class="${late?'late':''}"><b>${late}</b><span>Overdue</span></div><div><b>${today.length}</b><span>To do today</span></div><div><b>${done.length}</b><span>Done today</span></div></div>`}
  if(paused.length){h+=`<div class="sec"><span>${ms('play_circle')}${mine?'Pick up where you left off':'In progress'}</span></div>`;
    paused.forEach(w=>{const p=progOf(w),a=A(w.asset);h+=mine?`<div class="resume" data-act="open" data-id="${w.id}">${statP(w)} ${prioP(w.prio)}<div class="t">${a.name} — ${w.task}</div><div class="m">${w.paused?esc(w.paused):a.loc}</div><div class="prog">${steps(w).map((s,i)=>`<i class="${isDone(w,i)?'d':i===w.step?'c':''}"></i>`).join('')}</div><div style="display:flex;align-items:center;justify-content:space-between"><span class="m">Step ${(w.step||0)+1} of ${p.n} · ${p.d} done</span><button class="btn pri" data-act="run" data-id="${w.id}">${ms('play_arrow')}Resume</button></div></div>`:woRow(w,true)})}
  if(today.length){h+=`<div class="sec"><span>${ms('today')}Today</span><span style="text-transform:none;letter-spacing:0;font-weight:500">${today.length}</span></div>`;today.forEach(w=>h+=woRow(w,!mine))}
  if(up.length){h+=`<div class="sec"><span>${ms('upcoming')}Upcoming</span></div>`;up.forEach(w=>h+=woRow(w,!mine))}
  if(done.length){h+=`<div class="sec"><span>${ms('task_alt')}Completed today</span></div>`;done.forEach(w=>h+=woRow(w,!mine))}
  if(!list.length)h+=`<div class="empty">${ms('done_all')}Nothing here</div>`;
  return h+`</div></div>`};
function woRow(w,showWho){const a=A(w.asset),ti=TYPEI[w.type]||TYPEI.Corrective;
  const act=w.who!==ME?'':w.status==='done'?`<span class="pill s-done">${ms('check')}Done</span>`:w.status==='paused'||w.status==='prog'?`<button class="go res" data-act="run" data-id="${w.id}">${ms('play_arrow')}Resume</button>`:w.due==='Upcoming'?'':`<button class="go" data-act="run" data-id="${w.id}">${ms('play_arrow')}Start</button>`;
  return`<div class="wo ${w.late&&w.status==='sched'?'late':''}" data-act="open" data-id="${w.id}"><div class="ic" style="background:${ti[1]};color:${ti[2]}">${ms(ti[0])}</div><div class="b"><div class="t">${a.name} — ${esc(w.task)}</div><div class="m">${statP(w)} ${w.prio==='crit'||w.prio==='high'?prioP(w.prio):''}<span>${ms('schedule')}${w.when}</span>${w.offline?`<span class="tag-off">${ms('cloud_upload')}Not synced</span>`:''}</div>${showWho?`<div class="who">${P(w.who).name}</div>`:''}</div><div class="act">${act}</div></div>`}

VIEWS.wo=c=>{const w=wo(c.id),a=A(w.asset),p=progOf(w),u=S.unread[w.id]||0;
  let h=appbar(`<span class="mono" style="font-size:14px;opacity:.8">${w.id}</span>`,'',{back:1});
  h+=`<div class="content"><div class="hero"><div style="display:flex;gap:6px;flex-wrap:wrap">${statP(w)} ${prioP(w.prio)} <span class="pill p-low">${w.type}</span></div><h2>${a.name} — ${esc(w.task)}</h2>`;
  if(w.status==='paused'||w.status==='prog')h+=`<div class="prog">${steps(w).map((s,i)=>`<i class="${isDone(w,i)?'d':i===w.step?'c':''}"></i>`).join('')}</div><div style="font-size:12px;color:var(--text2)">${p.d} of ${p.n} steps done${w.paused?' · '+esc(w.paused):''}</div>`;
  h+=`</div><div class="pad"><div class="card" style="padding:0 14px"><div class="kv">
    <div>${ms('precision_manufacturing')}<span>Equipment</span><b>${a.name}</b></div>
    <div>${ms('location_on')}<span>Location</span><b>${a.loc}</b></div>
    <div>${ms('schedule')}<span>Planned</span><b>${w.when}${w.late?` · <span style="color:var(--crit)">${w.late}</span>`:''}</b></div>
    <div>${ms('checklist')}<span>Checklist</span><b>${p.n} steps</b></div>
    <div>${ms('person')}<span>Assigned</span><b style="display:flex;align-items:center;gap:8px">${av(w.who,26)}${P(w.who).name}</b></div></div></div>
    <div class="card" style="margin-top:12px">
      <button class="rowlink" data-act="sheet" data-s="chat" data-ch="${w.id}" style="width:100%;text-align:left">${ms('forum','l')}<span class="x"><b>Discussion</b><small>${(S.chat[w.id]?.msgs.length||0)} messages${u?` · <span style="color:var(--accent);font-weight:600">${u} new</span>`:''}</small></span>${ms('chevron_right','r')}</button>
      <button class="rowlink" data-act="sheet" data-s="docs" data-a="${w.asset}" style="width:100%;text-align:left">${ms('description','l')}<span class="x"><b>Documents</b><small>${a.docs.length} linked</small></span>${ms('chevron_right','r')}</button>
      <button class="rowlink" data-act="asset" data-a="${w.asset}" style="width:100%;text-align:left">${ms('precision_manufacturing','l')}<span class="x"><b>Equipment details</b><small>Specs, history</small></span>${ms('chevron_right','r')}</button>
    </div></div>`;
  if(w.who===ME&&w.status!=='done')h+=`<div class="stick"><button class="btn pri lg block" data-act="run" data-id="${w.id}">${ms('play_arrow')}${w.status==='sched'?'Start intervention':'Resume intervention'}</button></div>`;
  return h+`</div>`};

VIEWS.run=c=>{const w=wo(c.id),a=A(w.asset),st=steps(w),i=w.step||0,s=st[i],v=ans(w.id)[i],u=S.unread[w.id]||0,ok=stepOk(w,i);
  const tm=S.timers[w.id]||0,mm=String(Math.floor(tm/60)).padStart(2,'0'),ss=String(tm%60).padStart(2,'0');
  let h=`<div class="runbar"><div class="row"><button class="ib" data-act="exitrun" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff">${ms('close')}</button><div class="ttl"><b>${a.name} — ${esc(w.task)}</b><small>Step ${i+1} of ${st.length}${S.online?'':' · offline'}</small></div><span class="timer ${w.status==='paused'?'p':''}"><i></i>00:${mm}:${ss}</span><button data-act="sheet" data-s="pause" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--nav)">${ms('pause')}</button></div>
    <div class="runprog">${st.map((x,j)=>`<i class="${j<i||isDone(w,j)&&j!==i?'d':j===i?'c':''}"></i>`).join('')}</div></div>`;
  h+=`<div class="content"><div class="step"><div class="no">Step ${i+1} of ${st.length}<span class="req">${s.req?ms('lock')+'Mandatory':'Optional'}</span></div><h2>${esc(s.t)}</h2><p class="help">${esc(s.help||'')}</p>`;
  if(s.type==='confirm'){const sel=v||[];if(s.safety)h+=`<div class="safety"><h4>${ms('health_and_safety')}Safety first</h4><div style="font-size:12px;color:var(--text2)">Tick each action once done.</div></div>`;
    s.items.forEach((it,k)=>{const on=sel.includes(k)||(w.done&&w.done.includes(i)&&v==null);h+=`<button class="tick ${on?'on':''}" data-act="tick" data-k="${k}"><span class="bx">${on?ms('check'):''}</span><span>${esc(it)}</span></button>`})}
  if(s.type==='number'){h+=`<div class="num"><input type="text" inputmode="decimal" value="${esc(v??'')}" data-in="num" placeholder="0"><span class="u">${s.unit}</span></div><div class="range" id="rng">${rangeHtml(s,v)}</div>`}
  if(s.type==='yesno')h+=`<div class="yn"><button class="y ${v===false?'on':''}" data-act="yn" data-v="0">${ms('check_circle')}${esc(s.no)}</button><button class="n ${v===true?'on':''}" data-act="yn" data-v="1">${ms('error')}${esc(s.yes)}</button></div>${v===true?`<div class="range bad" style="margin-top:12px">${ms('report')}An anomaly will be reported to the work order.</div>`:''}`;
  if(s.type==='photo')h+=v?`<div class="shot">${ms('photo_camera')}<span>IMG_${w.id.slice(-4)}_${i+1}.jpg · ${v}</span><button data-act="photo" style="color:#fff;display:flex;align-items:center;gap:4px">${ms('refresh')}Retake</button></div>`:`<button class="photo" data-act="photo">${ms('photo_camera')}<b>Take a photo</b><small>${s.req?'Required':'Optional'}</small></button>`;
  if(s.type==='part'){const q=v??0;h+=`<div class="qty"><span class="ms" style="color:var(--text2);font-size:28px">inventory_2</span><div class="x"><b>${esc(s.part[0])}</b><small>${esc(s.part[1])}</small></div><button data-act="qty" data-d="-1">${ms('remove')}</button><b>${q}</b><button data-act="qty" data-d="1">${ms('add')}</button></div>${q?'':`<div class="range">${ms('info')}Planned quantity: ${s.qty}</div>`}`}
  if(s.type==='text')h+=`<textarea class="ta" data-in="text" placeholder="Type or dictate…">${esc(v||'')}</textarea>`;
  if(s.doc!=null){const d=a.docs[s.doc]||a.docs[0];h+=`<button class="docchip" data-act="sheet" data-s="docs" data-a="${w.asset}" style="width:100%;text-align:left">${ms('picture_as_pdf')}<span class="x">${esc(d[0])}<small>Step document · ${d[1]}${S.online?'':' · available offline'}</small></span>${ms('open_in_new')}</button>`}
  h+=`</div></div>`;
  const last=(S.chat[w.id]?.msgs||[]).slice(-1)[0];
  if(u&&last)h+=`<div class="lastmsg" data-act="sheet" data-s="chat" data-ch="${w.id}"><b>${P(last[0]).name}</b>${esc(last[1]).slice(0,70)}${last[1].length>70?'…':''}</div>`;
  h+=`<button class="fab" data-act="sheet" data-s="chat" data-ch="${w.id}" aria-label="Work order chat">${ms('forum','f')}${u?`<span class="bdg">${u}</span>`:''}</button>`;
  h+=`<div class="miss" style="${ok?'display:none':''}">${ms('error')} 1 required answer missing</div>`;
  h+=`<div class="runfoot"><button class="btn prev" data-act="prev" ${i===0?'disabled':''}>${ms('arrow_back')}</button><button class="btn pri lg" data-act="next" ${ok?'':'disabled'}>${i===st.length-1?'Review & close':'Next step'}${ms('arrow_forward')}</button></div>`;
  return h};

VIEWS.review=c=>{const w=wo(c.id),a=A(w.asset),d=V.draft,st=steps(w),an=st.map((s,i)=>{const v=ans(w.id)[i];return(s.type==='number'&&outOf(s,v))||(s.type==='yesno'&&v===true)}).filter(Boolean).length;
  let h=`<div class="runbar"><div class="row"><button data-act="back" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff">${ms('arrow_back')}</button><div class="ttl"><b>Review & close</b><small>${a.name} — ${esc(w.task)}</small></div></div></div>`;
  h+=`<div class="content"><div class="step"><div class="card" style="padding:14px;display:flex;gap:12px;align-items:center">${ms('task_alt','f')}<div style="flex:1"><b>${st.length} of ${st.length} steps done</b><div style="font-size:12px;color:var(--text2)">${an?`<span style="color:var(--crit);font-weight:600">${an} anomaly reported</span>`:'No anomaly'} · ${(S.timers[w.id]?Math.max(1,Math.round(S.timers[w.id]/60)):1)} min</div></div></div>
  <span class="lbl">Is the equipment operational?</span><div class="yn"><button class="y ${d.op===true?'on':''}" data-act="op" data-v="1">${ms('check_circle')}Yes</button><button class="n ${d.op===false?'on':''}" data-act="op" data-v="0">${ms('cancel')}No</button></div>
  ${d.op===false?`<div class="alert" style="margin-top:12px">${ms('info')}<span><b>A follow-up work order will be created</b> and the equipment stays flagged as not operational.</span></div>`:''}
  <span class="lbl">Completion comment</span><textarea class="ta" data-in="cmt" placeholder="What did you do? (required)">${esc(d.cmt||'')}</textarea>
  <button class="tick" data-act="followup" style="margin-top:12px"><span class="bx" style="${d.fu?'background:var(--ok);border-color:var(--ok)':''}">${d.fu?ms('check'):''}</span><span>Leave a handover note for the next shift</span></button>
  </div></div><div class="runfoot"><button class="btn ok lg" style="flex:1" data-act="complete" ${d.op!=null&&(d.cmt||'').trim()?'':'disabled'}>${ms('check')}Complete intervention</button></div>`;
  return h};

VIEWS.done=c=>{const w=wo(c.id),a=A(w.asset);
  return`<div class="content" style="background:#fff"><div class="done"><div class="big">${ms(S.online?'check':'cloud_upload','f')}</div><h2>Intervention completed</h2><p>${a.name} — ${esc(w.task)}<br>${S.online?'Saved and shared with the team.':'Saved on your phone. It will be sent automatically when the network is back.'}</p><button class="btn pri lg block" data-act="tab" data-t="todo">Back to my to do</button><button class="btn sec2 lg block" style="margin-top:10px" data-act="tab" data-t="scan">${ms('qr_code_scanner')}Scan next equipment</button></div></div>`};

VIEWS.search=()=>{const q=S.q.trim(),f=S.sFilter;
  let h=appbar('Search');
  h+=`<div style="background:var(--nav);padding:0 16px 14px"><div class="sbox">${ms('search')}<input data-in="q" value="${esc(S.q)}" placeholder="Equipment, work order, part…" data-autofocus>${q?`<button data-act="clearq">${ms('close')}</button>`:`<button data-act="tab" data-t="scan" style="color:var(--accent)">${ms('qr_code_scanner')}</button>`}</div></div>`;
  h+=`<div class="content"><div class="pad"><div class="chips">${[['all','All'],['eq','Equipment'],['wo','Work orders'],['part','Spare parts'],['doc','Documents'],['ppl','People']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="sf" data-f="${k}">${l}</button>`).join('')}</div>`;
  if(!q){h+=`<div class="sec"><span>Recent</span></div>`+RECENT.map(r=>`<button class="recent" data-act="setq" data-q="${r}">${ms('history')}${r}</button>`).join('');
    h+=`<div class="sec"><span>Nearby equipment</span></div>`+['P-101','V-12','CNV-3'].map(k=>res('eq',k,A(k).name,A(k).loc,'')).join('');return h+`</div></div>`}
  const L=q.toLowerCase(),out=[];
  if(f==='all'||f==='eq')Object.keys(ASSETS).forEach(k=>{const a=A(k);if((a.name+' '+k+' '+a.type+' '+a.loc).toLowerCase().includes(L))out.push(res('eq',k,a.name,a.type+' · '+a.loc,q))});
  if(f==='all'||f==='wo')S.wos.forEach(w=>{const t=A(w.asset).name+' — '+w.task;if((t+' '+w.id).toLowerCase().includes(L))out.push(res('wo',w.id,t,w.id+' · '+STAT[w.status][0]+' · '+P(w.who).name,q))});
  if(f==='all'||f==='part')PARTS.forEach(p=>{if((p[0]+p[1]).toLowerCase().includes(L))out.push(res('part',p[0],p[0],p[1],q))});
  if(f==='all'||f==='doc')Object.keys(ASSETS).forEach(k=>A(k).docs.forEach(d=>{if(d[0].toLowerCase().includes(L))out.push(res('doc',k,d[0],d[1]+' · '+A(k).name,q))}));
  if(f==='all'||f==='ppl')Object.keys(PEOPLE).forEach(k=>{const p=P(k);if((p.name+p.role).toLowerCase().includes(L))out.push(res('ppl',k,p.name,p.role,q))});
  h+=`<div class="sec"><span>${out.length} result${out.length>1?'s':''}</span></div>`+(out.join('')||`<div class="empty">${ms('search_off')}No result for “${esc(q)}”</div>`);
  return h+`</div></div>`};
function res(kind,id,title,sub,q){const I={eq:['precision_manufacturing','Equipment'],wo:['build','Work order'],part:['inventory_2','Spare part'],doc:['description','Document'],ppl:['person','Person']}[kind];
  return`<button class="res" data-act="res" data-k="${kind}" data-id="${esc(id)}">${kind==='ppl'?av(id,40):`<span class="cic" style="background:var(--bg);color:var(--text2)">${ms(I[0])}</span>`}<span class="x"><span class="k">${I[1]}</span><b>${hl(title,q)}</b><small>${hl(sub,q)}</small></span>${ms('chevron_right')}</button>`}

VIEWS.chat=()=>{const f=S.chatFilter;
  let h=appbar('Chat','All your conversations',{right:`<button class="ib" data-act="sheet" data-s="newchat">${ms('edit_square')}</button>`});
  h+=`<div class="content"><div style="padding:12px 16px 8px;background:#fff;border-bottom:1px solid var(--border)"><div class="chips">${[['all','All'],['dm','Direct'],['team','Teams'],['site','Site'],['wo','Work orders']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="cf" data-f="${k}">${l}</button>`).join('')}</div></div>`;
  const keys=Object.keys(S.chat).filter(k=>f==='all'||S.chat[k].kind===f).sort((a,b)=>{const la=S.chat[a].msgs.slice(-1)[0],lb=S.chat[b].msgs.slice(-1)[0];return(lb?lb[2]:'').localeCompare(la?la[2]:'')});
  keys.forEach(k=>{const c=S.chat[k],m=c.msgs.slice(-1)[0],u=S.unread[k]||0,ci=chInfo(k);
    h+=`<button class="conv" data-act="thread" data-ch="${k}">${ci.icon}<span class="x"><b><span>${ci.title}</span><small>${m?m[2]:''}</small></b><p>${m?(m[0]===ME?'You: ':P(m[0]).name.split(' ')[0]+': ')+esc(m[1]):''}</p></span>${u?`<span class="u">${u}</span>`:''}</button>`});
  return h+`</div>`};
function chInfo(k){const c=S.chat[k];
  if(c.kind==='dm'){const p=P(c.who);return{title:p.name,sub:p.role,icon:av(c.who,40)}}
  if(c.kind==='wo'){const w=wo(k);return{title:A(w.asset).name+' — '+w.task,sub:k,icon:`<span class="cic" style="background:#FDECEC;color:var(--crit)">${ms('build')}</span>`}}
  if(c.kind==='site')return{title:c.title,sub:c.sub,icon:`<span class="cic" style="background:#EAF1FD;color:var(--info)">${ms('factory')}</span>`};
  return{title:c.title,sub:c.sub,icon:`<span class="cic" style="background:#E6F4EE;color:var(--ok)">${ms('groups')}</span>`}}
function msgList(k){const c=S.chat[k];return`<div class="msgs">`+c.msgs.map(m=>{const me=m[0]===ME;const txt=esc(m[1]).replace(/@(\w+)/g,'<span class="mention">@$1</span>');
  return`<div class="msg ${me?'me':''}">${me?'':av(m[0],28)}<div><div class="bub">${me||c.kind==='dm'?'':`<small>${P(m[0]).name}</small>`}${txt}${m[3]?`<div class="ref">${ms('photo_camera')}Photo · step ${m[3]}</div>`:''}</div><div class="tm">${m[2]}${me?(m[4]?` ${ms('schedule')} waiting for network`:` ${ms('done_all')}`):''}</div></div></div>`}).join('')+`</div>`}
function composer(k){return`<div class="composer"><button data-act="attach" style="color:var(--text2)">${ms('add_circle')}</button><input data-in="msg" placeholder="${S.online?'Message…':'Message (sent when online)…'}"><button class="send" data-act="send" data-ch="${k}">${ms('send','f')}</button></div>`}
VIEWS.thread=c=>{const k=c.ch,ci=chInfo(k);S.unread[k]=0;save();
  let h=`<header class="appbar"><div class="row"><button class="ib" data-act="back">${ms('arrow_back')}</button>${ci.icon}<div class="ttl" style="font-size:16px">${ci.title}<div class="sub">${ci.sub}</div></div>${S.chat[k].kind==='wo'?`<button class="ib" data-act="open" data-id="${k}">${ms('open_in_new')}</button>`:''}</div></header>${S.online?'':`<div class="offbanner">${ms('cloud_off')}Offline · messages are sent when the network is back</div>`}`;
  return h+`<div class="content">${msgList(k)}</div>${composer(k)}`};

VIEWS.scan=()=>`<div class="content" style="position:relative"><div class="cam"><div class="top"><button class="ib" data-act="tab" data-t="todo">${ms('close')}</button><b>Scan equipment</b><button class="ib" data-act="flash">${ms(V.flash?'flash_on':'flash_off')}</button></div>
  <div class="vf" data-act="scanhit" data-a="P-101"><div class="qr"></div><i></i><i></i><i></i><i></i><div class="line"></div></div>
  <div class="hint">Point at the QR label on the equipment<small>${S.online?'':'Offline: equipment data stays available'}</small></div>
  <div class="demo"><p>Demo · simulate a scan</p><div class="chips">${Object.keys(ASSETS).map(k=>`<button class="chip" data-act="scanhit" data-a="${k}">${ms('qr_code_2')}${A(k).name}</button>`).join('')}</div>
  <div class="man"><input data-in="code" placeholder="Or type the equipment code (e.g. P-101)"><button class="btn pri" data-act="code" style="height:40px">${ms('arrow_forward')}</button></div></div></div></div>`;

VIEWS.asset=c=>{const k=c.a,a=A(k),open=S.wos.filter(w=>w.asset===k&&w.status!=='done'),mine=open.find(w=>w.who===ME);
  const st={ok:['s-prog','check_circle'],warn:['s-wait','warning'],stop:['s-late','block']}[a.state];
  let h=appbar(c.scanned?'Scanned':'Equipment','',{back:1});
  h+=`<div class="content"><div class="eqhead"><div class="row"><div class="eqimg">${ms(a.icon)}</div><div><h2>${a.name}</h2><div class="loc">${ms('location_on')}${a.loc}</div></div></div>
    <div class="state"><span class="pill ${st[0]}">${ms(st[1])}${a.stateTxt}</span><span class="pill p-low">Criticality ${a.crit}</span><span class="pill ${open.length?'s-sch':'p-low'}">${open.length} open WO</span></div></div><div class="pad">`;
  if(mine)h+=`<div class="alert">${ms('assignment_ind')}<span><b>You have a work order here:</b> ${esc(mine.task)} · ${mine.when}</span></div>`;
  h+=`<div class="bigact">
    <button class="a1" data-act="${mine?'run':'quick'}" data-id="${mine?mine.id:''}" data-a="${k}">${ms(mine?'play_circle':'add_circle','f')}<span><b>${mine?(mine.status==='sched'?'Start':'Resume')+' intervention':'Start an intervention'}</b><small>${mine?esc(mine.task):'Create a work order and start now'}</small></span></button>
    <button class="a2" data-act="incident" data-a="${k}">${ms('report','f')}<span><b>Report an incident</b><small>Breakdown, leak, noise… in 3 taps</small></span></button>
    <button class="a3" data-act="full" data-a="${k}">${ms('info')}<span><b>Full equipment details</b><small>Specs, history, documents</small></span>${ms('chevron_right')}</button></div>`;
  h+=`<div class="sec"><span>Last intervention</span></div><div class="card" style="padding:12px;font-size:13px;display:flex;gap:10px;align-items:center">${ms('history')}${esc(a.last)}</div>`;
  if(open.filter(w=>w!==mine).length){h+=`<div class="sec"><span>Other open work orders</span></div>`;open.filter(w=>w!==mine).forEach(w=>h+=woRow(w,true))}
  return h+`</div></div>`};

VIEWS.full=c=>{const a=A(c.a);
  let h=appbar(a.name,a.type,{back:1});
  h+=`<div class="content"><div class="pad"><div class="sec" style="margin-top:4px"><span>Key specifications</span></div><div class="card" style="padding:0 14px"><div class="kv">${a.specs.map(s=>`<div><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div></div>
  <div class="sec"><span>Documents</span></div><div class="card">${a.docs.map(d=>`<button class="rowlink" data-act="toastdoc" style="width:100%;text-align:left">${ms('picture_as_pdf','l')}<span class="x"><b style="font-weight:500">${d[0]}</b><small>${d[1]}</small></span>${ms('download_for_offline','r')}</button>`).join('')}</div>
  <div class="sec"><span>History</span></div><div class="card">${a.hist.map(x=>`<div class="rowlink">${ms('event_note','l')}<span class="x"><b style="font-weight:500">${x[1]}</b><small>${x[0]} · ${x[2]}</small></span></div>`).join('')}</div></div></div>`;
  return h};

VIEWS.incident=c=>{const a=A(c.a),d=V.draft;const ISS=[['Breakdown','power_off'],['Leak','water_drop'],['Noise / vibration','graphic_eq'],['Overheating','device_thermostat'],['Electrical','electric_bolt'],['Other','more_horiz']];
  let h=`<header class="appbar"><div class="row"><button class="ib" data-act="back">${ms('close')}</button><div class="ttl" style="font-size:17px">Report an incident<div class="sub">${a.name} · ${a.loc}</div></div></div></header>${S.online?'':`<div class="offbanner">${ms('cloud_off')}Offline · the report is sent when the network is back</div>`}`;
  h+=`<div class="content"><div class="pad"><span class="lbl" style="margin-top:4px">What's the problem?</span><div class="grid2">${ISS.map(([l,i])=>`<button class="issue ${d.issue===l?'on':''}" data-act="issue" data-v="${l}">${ms(i)}${l}</button>`).join('')}</div>
  <div class="tgl" style="margin-top:14px" data-act="stop"><span class="ms" style="color:var(--crit)">front_hand</span><span class="x"><b>Production stopped</b><small>Sets priority to Critical and alerts the team</small></span><span class="sw ${d.stop?'on':''}"></span></div>
  <span class="lbl">Photo</span>${d.photo?`<div class="shot">${ms('photo_camera')}<span>Photo added · ${d.photo}</span><button data-act="iphoto" style="color:#fff">${ms('refresh')}</button></div>`:`<button class="photo" data-act="iphoto" style="height:110px">${ms('photo_camera')}<b>Add a photo</b><small>Optional</small></button>`}
  <span class="lbl">Comment</span><textarea class="ta" data-in="icmt" placeholder="Optional · what did you see?">${esc(d.icmt||'')}</textarea></div>
  <div class="stick" style="flex-direction:column"><button class="btn pri lg block" data-act="sendinc" data-a="${c.a}" ${d.issue?'':'disabled'}>${ms('send')}Send report</button><button class="btn sec2 lg block" data-act="sendinc" data-a="${c.a}" data-start="1" ${d.issue?'':'disabled'}>${ms('play_arrow')}Send and fix it myself now</button></div></div>`;
  return h};

VIEWS.me=()=>{const p=P(ME);
  let h=appbar('Me');
  h+=`<div class="content"><div class="pad"><div class="card" style="padding:16px;display:flex;gap:14px;align-items:center">${av(ME,52)}<div><b style="font-size:16px">${p.name}</b><div style="font-size:13px;color:var(--text2)">${p.role} · Mechanical team</div><div style="font-size:12px;color:var(--text3)">Thourotte Plant · Shift 06:00–14:00</div></div></div>
  <div class="sec"><span>Offline & sync</span></div>
  <div class="tgl" data-act="online">${ms(S.online?'cloud_done':'cloud_off')}<span class="x"><b>${S.online?'Online':'Offline'}</b><small>Demo: switch to test working without network</small></span><span class="sw ${S.online?'':'on'}"></span></div>
  <div class="card" style="padding:4px 14px;margin-top:10px">${S.queue.length?S.queue.map(q=>`<div class="queue">${ms('cloud_upload')}<span style="flex:1">${esc(q.label)}</span><small style="color:var(--text3)">${q.at}</small></div>`).join(''):`<div class="queue">${ms('cloud_done')}<span style="flex:1;color:var(--text2)">Everything is synced</span></div>`}</div>
  <div class="card" style="padding:12px 14px;margin-top:10px;font-size:13px;color:var(--text2);display:flex;gap:10px">${ms('download_done')}<span>Available offline: your work orders for 7 days, their checklists and documents, all equipment of Thourotte Plant.</span></div>
  <div class="sec"><span>Settings</span></div><div class="card">
    <div class="rowlink">${ms('notifications','l')}<span class="x"><b style="font-weight:500">Notifications</b><small>Mentions, assignments, critical alerts</small></span>${ms('chevron_right','r')}</div>
    <div class="rowlink">${ms('language','l')}<span class="x"><b style="font-weight:500">Language</b><small>English</small></span>${ms('chevron_right','r')}</div>
    <div class="rowlink">${ms('factory','l')}<span class="x"><b style="font-weight:500">Site</b><small>Thourotte Plant</small></span>${ms('chevron_right','r')}</div>
    <a class="rowlink" href="../v3/Home.dc.html" style="color:inherit;text-decoration:none">${ms('desktop_windows','l')}<span class="x"><b style="font-weight:500">Open the web app</b><small>Planning, setup, reports</small></span>${ms('open_in_new','r')}</a></div>
  <button class="btn sec2 block" style="margin-top:16px" data-act="reset">${ms('restart_alt')}Reset demo data</button></div></div>`;
  return h};

/* ================= SHEETS ================= */
const SHEETS={};
SHEETS.chat=s=>{const k=s.ch,ci=chInfo(k);S.unread[k]=0;
  return`<div class="scrim" data-act="close"></div><div class="sheet tall"><div class="grab"></div><div class="hd">${ms('forum')}<b>Work order chat<small>${ci.title} · ${k}</small></b><button data-act="close">${ms('close')}</button></div><div class="bd" style="padding:0;background:var(--bg)">${msgList(k)}</div>
  <div style="display:flex;gap:8px;padding:8px 12px 0;background:#fff;border-top:1px solid var(--border)"><button class="chip" data-act="quickmsg" data-ch="${k}" data-t="Step done, moving on.">Step done</button><button class="chip" data-act="quickmsg" data-ch="${k}" data-t="I need help on site.">Need help</button><button class="chip" data-act="quickmsg" data-ch="${k}" data-t="Waiting for a spare part.">Waiting for part</button></div>${composer(k)}</div>`};
SHEETS.pause=s=>`<div class="scrim" data-act="close"></div><div class="sheet"><div class="grab"></div><div class="hd">${ms('pause_circle')}<b>Pause the intervention<small>Your progress is kept. Why are you pausing?</small></b></div><div class="bd">
  ${[['Waiting for spare parts','inventory_2'],['Waiting for access / production','lock_clock'],['Need another skill','engineering'],['Break / end of shift','coffee']].map(([l,i])=>`<button class="opt" data-act="dopause" data-r="${l}">${ms(i)}<span>${l}</span></button>`).join('')}</div></div>`;
SHEETS.docs=s=>{const a=A(s.a);return`<div class="scrim" data-act="close"></div><div class="sheet"><div class="grab"></div><div class="hd">${ms('description')}<b>Documents<small>${a.name}</small></b><button data-act="close">${ms('close')}</button></div><div class="bd">${a.docs.map(d=>`<button class="opt" data-act="toastdoc">${ms('picture_as_pdf')}<span style="flex:1">${d[0]}<small style="display:block;color:var(--text2);font-size:12px">${d[1]} · available offline</small></span>${ms('open_in_new')}</button>`).join('')}</div></div>`};
SHEETS.sync=()=>`<div class="scrim" data-act="close"></div><div class="sheet"><div class="grab"></div><div class="hd">${ms(S.online?'cloud_done':'cloud_off')}<b>${S.online?'Online':'Offline mode'}<small>${S.online?'Everything you do is saved instantly':'You can keep working. Changes are stored on your phone.'}</small></b></div><div class="bd">
  ${S.queue.length?`<div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">WAITING TO SYNC (${S.queue.length})</div>`+S.queue.map(q=>`<div class="queue">${ms('cloud_upload')}<span style="flex:1">${esc(q.label)}</span><small style="color:var(--text3)">${q.at}</small></div>`).join(''):`<div class="queue">${ms('cloud_done')}<span>Nothing waiting</span></div>`}
  <button class="btn ${S.online?'sec2':'pri'} block" style="margin-top:14px" data-act="online">${ms(S.online?'cloud_off':'cloud_sync')}${S.online?'Simulate network loss':'Network is back: sync now'}</button></div></div>`;
SHEETS.newchat=()=>`<div class="scrim" data-act="close"></div><div class="sheet"><div class="grab"></div><div class="hd">${ms('edit_square')}<b>New message</b></div><div class="bd">${Object.keys(PEOPLE).filter(k=>k!==ME).map(k=>`<button class="opt" data-act="dm" data-k="${k}">${av(k,32)}<span style="flex:1">${P(k).name}<small style="display:block;color:var(--text2);font-size:12px">${P(k).role}</small></span></button>`).join('')}</div></div>`;

/* ================= ACTIONS ================= */
function startRun(id){const w=wo(id);if(w.status==='sched'){w.status='prog';queue(`Started: ${A(w.asset).name} — ${w.task}`)}if(w.status==='paused'){w.status='prog';w.paused=null;queue(`Resumed: ${A(w.asset).name} — ${w.task}`)}w.step=w.step||0;save();V.stack.push({v:'run',id});V.sheet=null;render(true)}
function sendMsg(k,t){if(!t.trim())return;S.chat[k].msgs.push([ME,t.trim(),now(),null,S.online?0:1]);queue(`Message: “${t.trim().slice(0,30)}”`);save();render()}
const ACT={
  tab:e=>tab(e.dataset.t),back:()=>back(),close:()=>{V.sheet=null;render()},
  scope:e=>{S.scope=e.dataset.s;save();render(true)},
  open:e=>go('wo',{id:e.dataset.id}),
  run:e=>startRun(e.dataset.id),
  exitrun:()=>{V.stack=[{v:V.tab}];render(true);toast('Intervention kept in progress. Resume it from To do.')},
  sheet:e=>{V.sheet={type:e.dataset.s,ch:e.dataset.ch,a:e.dataset.a};render()},
  tick:e=>{const w=wo(cur().id),i=w.step,s=steps(w)[i];let a=ans(w.id)[i];if(a==null)a=(w.done&&w.done.includes(i))?s.items.map((_,k)=>k):[];const k=+e.dataset.k;a=a.includes(k)?a.filter(x=>x!==k):[...a,k];ans(w.id)[i]=a;save();render()},
  yn:e=>{const w=wo(cur().id);ans(w.id)[w.step]=e.dataset.v==='1';save();render()},
  photo:()=>{const w=wo(cur().id);ans(w.id)[w.step]=now();queue('Photo for '+w.id);save();render()},
  qty:e=>{const w=wo(cur().id);const v=(ans(w.id)[w.step]||0)+(+e.dataset.d);ans(w.id)[w.step]=Math.max(0,v);save();render()},
  prev:()=>{const w=wo(cur().id);w.step=Math.max(0,w.step-1);save();render(true)},
  next:()=>{const w=wo(cur().id);const n=steps(w).length;if(w.step<n-1){w.step++;save();render(true)}else{V.draft={};go('review',{id:w.id})}},
  dopause:e=>{const w=wo(cur().id);w.status='paused';w.paused=e.dataset.r;queue(`Paused: ${A(w.asset).name} (${e.dataset.r})`);save();V.stack=[{v:'todo'}];V.tab='todo';V.sheet=null;render(true);toast('Intervention paused. Resume it anytime.')},
  op:e=>{V.draft.op=e.dataset.v==='1';render()},
  followup:()=>{V.draft.fu=!V.draft.fu;render()},
  complete:()=>{const w=wo(cur().id);w.status='done';w.when=now();w.paused=null;if(!S.online){w.offline=1}queue(`Completed: ${A(w.asset).name} — ${w.task}`);save();V.stack=[{v:'done',id:w.id}];render(true)},
  thread:e=>go('thread',{ch:e.dataset.ch}),
  cf:e=>{S.chatFilter=e.dataset.f;save();render()},
  send:e=>{const i=$app.querySelector('[data-in=msg]');sendMsg(e.dataset.ch,i.value)},
  quickmsg:e=>sendMsg(e.dataset.ch,e.dataset.t),
  attach:()=>toast('Photo or document attachment (demo)'),
  dm:e=>{const k='dm-'+e.dataset.k;if(!S.chat[k])S.chat[k]={kind:'dm',who:e.dataset.k,msgs:[]};save();V.sheet=null;go('thread',{ch:k})},
  sf:e=>{S.sFilter=e.dataset.f;save();render()},
  setq:e=>{S.q=e.dataset.q;save();render()},clearq:()=>{S.q='';save();render(true)},
  res:e=>{const k=e.dataset.k,id=e.dataset.id;if(k==='eq'||k==='doc')go('asset',{a:id});else if(k==='wo')go('wo',{id});else if(k==='ppl'){const c='dm-'+id;if(!S.chat[c])S.chat[c]={kind:'dm',who:id,msgs:[]};go('thread',{ch:c})}else toast(id+' · '+PARTS.find(p=>p[0]===id)[1])},
  scanhit:e=>{if(navigator.vibrate)try{navigator.vibrate(40)}catch(_){}V.stack=[{v:'scan'},{v:'asset',a:e.dataset.a,scanned:1}];render(true)},
  code:()=>{const v=($app.querySelector('[data-in=code]').value||'').trim().toUpperCase();const k=Object.keys(ASSETS).find(x=>x===v||x.replace('-','')===v.replace('-',''));if(k){V.stack=[{v:'scan'},{v:'asset',a:k,scanned:1}];render(true)}else toast('Unknown code. Try P-101, V-12, CNV-3, C-2 or B-4',1)},
  flash:()=>{V.flash=!V.flash;render()},
  asset:e=>go('asset',{a:e.dataset.a}),full:e=>go('full',{a:e.dataset.a}),
  quick:e=>{const k=e.dataset.a,id='WO-'+(1339900+S.wos.length);S.wos.unshift({id,asset:k,task:'Quick intervention',type:'Corrective',prio:'high',status:'sched',when:now(),due:'Today',cl:'quick',who:ME});S.chat[id]={kind:'wo',msgs:[]};queue('New work order on '+A(k).name);save();startRun(id)},
  incident:e=>{V.draft={};go('incident',{a:e.dataset.a})},
  issue:e=>{V.draft.issue=e.dataset.v;render()},stop:()=>{V.draft.stop=!V.draft.stop;render()},iphoto:()=>{V.draft.photo=now();render()},
  sendinc:e=>{const k=e.dataset.a,d=V.draft,id='WO-'+(1339900+S.wos.length);const nw={id,asset:k,task:d.issue,type:'Corrective',prio:d.stop?'crit':'high',status:e.dataset.start?'sched':'req',when:now(),due:'Today',cl:'quick',who:e.dataset.start?ME:'GD',offline:S.online?0:1};
    S.wos.unshift(nw);S.chat[id]={kind:'wo',msgs:[[ME,`Incident reported: ${d.issue}${d.stop?' · production stopped':''}${d.icmt?' — '+d.icmt:''}`,now(),d.photo?1:null,S.online?0:1]]};queue(`Incident: ${d.issue} on ${A(k).name}`);save();
    if(e.dataset.start)startRun(id);else{V.stack=[{v:'asset',a:k}];render(true);toast(S.online?'Incident sent to the maintenance team':'Incident saved. It will be sent when online.',!S.online)}},
  toastdoc:()=>toast('Opening document (demo)'),
  online:()=>{if(S.online){S.online=false;save();V.sheet=null;render();toast('You are offline. Keep working, nothing is lost.',1)}else{S.online=true;const n=S.queue.length;V.sheet=null;render();if(n){toast(`Syncing ${n} change${n>1?'s':''}…`);setTimeout(()=>{S.queue=[];S.wos.forEach(w=>delete w.offline);Object.values(S.chat).forEach(c=>c.msgs.forEach(m=>m[4]=0));save();render();toast('All changes synced')},1600)}else{save();render();toast('Back online')}}},
  reset:()=>{S=fresh();save();V={tab:'todo',stack:[{v:'todo'}],sheet:null,toast:null,draft:{}};render(true)},
  jump:e=>{const t=e.dataset.to;if(t==='run'){V.tab='todo';V.stack=[{v:'todo'}];startRun('WO-1339859')}else if(t==='offline'){tab('me');if(S.online)ACT.online()}else tab(t)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;e.preventDefault();e.stopPropagation();f(el)});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;const c=cur();
  if(k==='q'){S.q=e.target.value;save();const p=e.target.selectionStart;render();const i=$app.querySelector('[data-in=q]');if(i){i.focus();i.setSelectionRange(p,p)}}
  if(k==='num'){const w=wo(c.id),s=steps(w)[w.step];ans(w.id)[w.step]=e.target.value.replace(/[^0-9.,-]/g,'');save();const r=document.getElementById('rng');if(r)r.innerHTML=rangeHtml(s,e.target.value);const ok=stepOk(w,w.step);const b=$app.querySelector('[data-act=next]');if(b)b.disabled=!ok;const m=$app.querySelector('.miss');if(m)m.style.display=ok?'none':''}
  if(k==='text'){const w=wo(c.id);ans(w.id)[w.step]=e.target.value;save();const ok=stepOk(w,w.step);const b=$app.querySelector('[data-act=next]');if(b)b.disabled=!ok;const m=$app.querySelector('.miss');if(m)m.style.display=ok?'none':''}
  if(k==='cmt'){V.draft.cmt=e.target.value;const b=$app.querySelector('[data-act=complete]');if(b)b.disabled=!(V.draft.op!=null&&V.draft.cmt.trim())}
  if(k==='icmt')V.draft.icmt=e.target.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.in==='msg'){const b=$app.querySelector('[data-act=send]');if(b)sendMsg(b.dataset.ch,e.target.value)}if(e.key==='Enter'&&e.target.dataset.in==='code')ACT.code()});
setInterval(()=>{const c=cur();if(c.v==='run'){const w=wo(c.id);if(w.status==='prog'){S.timers[w.id]=(S.timers[w.id]||0)+1;const t=$app.querySelector('.timer');if(t){const x=S.timers[w.id];t.innerHTML=`<i></i>00:${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`}if(S.timers[w.id]%10===0)save()}}},1000);
window.addEventListener('online',()=>{if(!S.online)ACT.online()});
window.addEventListener('offline',()=>{if(S.online)ACT.online()});
render(true);
</script>
</body>
</html>
